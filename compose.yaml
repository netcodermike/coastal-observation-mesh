services:
  forecast:
    build: ./services/forecast
    ports:
      - "127.0.0.1:${DEMO_PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      OPERATION_PATH: /conditions
      UPSTREAM_URL: http://advisory:8081/assess
    depends_on:
      - advisory
  advisory:
    build: ./services/advisory
    environment:
      HOST: 0.0.0.0
      PORT: "8081"
      OPERATION_PATH: /assess
